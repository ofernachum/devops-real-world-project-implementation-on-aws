# This service account is used by Pod Identity to read from AWS secrets manager 
# and access other AWS resources as needed.
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "catalog.serviceAccountName" . }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

