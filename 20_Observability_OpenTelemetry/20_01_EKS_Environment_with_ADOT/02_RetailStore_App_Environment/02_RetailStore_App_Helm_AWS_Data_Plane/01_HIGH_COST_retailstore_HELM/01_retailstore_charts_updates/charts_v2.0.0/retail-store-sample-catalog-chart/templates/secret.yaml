# This will create a Kubernetes Secret for the Retail Store Catalog Microservice's MySQL credentials
# if enabled in the Helm values. However, it must not be created if useSecretsManager is tru since
# in this case the secret should be taken from AWS Secrets Manager.
# So - bottom line, in Catalog V2.0.0 this will not be used !

{{- if and (eq .Values.app.persistence.provider "mysql") .Values.app.persistence.secret.create }}
{{- if .Values.app.persistence.secret.useSecretsManager }}
{{- fail "ERROR: app.persistence.secret.create must be false when useSecretsManager is true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.persistence.secret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
type: Opaque
data:
  RETAIL_CATALOG_PERSISTENCE_USER: {{ .Values.app.persistence.secret.username | b64enc | quote }}
  RETAIL_CATALOG_PERSISTENCE_PASSWORD: {{ .Values.app.persistence.secret.password | b64enc | quote }}
{{- end }}