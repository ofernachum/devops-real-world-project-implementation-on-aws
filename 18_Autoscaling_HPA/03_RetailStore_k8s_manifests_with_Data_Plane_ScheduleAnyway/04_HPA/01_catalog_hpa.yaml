apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-hpa
  namespace: default
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/instance: catalog
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/owner: retail-store-sample
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # Wait 5 minutes before scaling down to avoid flapping
      # Scale down policies define how the HPA should reduce the number of pods when the 
      # metrics fall below the target. 
      # Remove 50 percent of the pods every 15 seconds
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15
      # Remove 1 pod every 60 seconds 
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min # Select the minimum of the two policies above to avoid scaling down too aggressively  
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
